[package]
name = "quotaline-macos-ffi"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
futures-channel = "0.3"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
quotaline-analytics = { version = "0.2.0", path = "../../crates/data/analytics", features = ["uniffi"] }
quotaline-antigravity = { version = "0.2.0", path = "../../crates/providers/antigravity" }
quotaline-catalog = { version = "0.2.0", path = "../../crates/catalog" }
quotaline-claude = { version = "0.2.0", path = "../../crates/providers/claude" }
quotaline-codex = { version = "0.2.0", path = "../../crates/providers/codex" }
quotaline-copilot = { version = "0.2.0", path = "../../crates/providers/copilot" }
quotaline-credentials = { version = "0.2.0", path = "../../crates/accounts/credentials" }
quotaline-cursor = { version = "0.2.0", path = "../../crates/providers/cursor" }
quotaline-demo = { version = "0.2.0", path = "../../crates/demo" }
quotaline-export = { version = "0.2.0", path = "../../crates/data/export" }
quotaline-gemini = { version = "0.2.0", path = "../../crates/providers/gemini" }
quotaline-http = { version = "0.2.0", path = "../../crates/http", features = ["uniffi"] }
quotaline-logging = { version = "0.2.0", path = "../../crates/logging" }
quotaline-notifications = { version = "0.2.0", path = "../../crates/presentation/notifications" }
quotaline-quota = { version = "0.2.0", path = "../../crates/presentation/quota", features = ["uniffi"] }
quotaline-refresh = { version = "0.2.0", path = "../../crates/refresh", features = ["uniffi"] }
quotaline-settings = { version = "0.2.0", path = "../../crates/settings" }
quotaline-setup = { version = "0.2.0", path = "../../crates/accounts/setup", features = ["uniffi"] }
quotaline-status-bar = { version = "0.2.0", path = "../../crates/presentation/status-bar", features = ["uniffi"] }
quotaline-text = { version = "0.2.0", path = "../../crates/presentation/text", features = ["uniffi"] }
quotaline-credential-sources = { version = "0.2.0", path = "../../crates/accounts/credential-sources" }
quotaline-storage = { version = "0.2.0", path = "../../crates/data/storage" }
quotaline-history = { version = "0.2.0", path = "../../crates/data/history", features = ["uniffi"] }
quotaline-macos-platform = { version = "0.2.0", path = "../platform" }
uniffi = "0.32.2"
url = "2.5.8"

[dev-dependencies]
base64 = "0.23"
futures-executor = "0.3"
mockall = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10.1"
security-framework = "3.7"
security-framework-sys = "2.17"
