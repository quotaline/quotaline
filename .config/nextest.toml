# Tests wait on events rather than deadlines; this only stops a test whose event never comes.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 1 }

[profile.ci-hosted]
inherits = "ci"
slow-timeout = { period = "60s", terminate-after = 1 }

[test-groups]
gnome-shell = { max-threads = 4 }

[[profile.default.overrides]]
filter = "binary(gnome_shell)"
test-group = "gnome-shell"
slow-timeout = { period = "180s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "test(demo_usage_and_history_reach_shell)"
priority = 100

[[profile.default.overrides]]
filter = "test(token_refresh_rechecks_a_cli_credential_before_contacting_oauth)"
priority = 100

[[profile.default.overrides]]
filter = "test(demo_formats_and_lifecycle_reach_shell)"
priority = 90

[[profile.default.overrides]]
filter = "test(demo_settings_reach_shell)"
priority = 80

[[profile.default.overrides]]
filter = "test(claude_local_analytics_reaches_history_without_network_credentials)"
priority = 70

[[profile.default.overrides]]
filter = "test(reset_notifications_cover_a_large_set_of_distinct_limits)"
priority = -100
