[advisories]
unused-ignored-advisory = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "hashbrown@0.16.1", reason = "rusqlite's wasm-only VFS retains hashbrown 0.16." },
  { crate = "shlex@1.3.0", reason = "libproc's bindgen uses shlex 1 while cc uses shlex 2." },
  { crate = "syn@2.0.119", reason = "zbus and tracing macros retain syn 2." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/gaborbernat/secret-service-rs"]
