[advisories]
unused-ignored-advisory = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "zbus and tracing macros retain syn 2." },
  { crate = "lock_api@0.4.14", reason = "crossterm 0.29, the terminal backend, retains parking_lot 0.12." },
  { crate = "parking_lot@0.12.5", reason = "crossterm 0.29, the terminal backend, retains parking_lot 0.12." },
  { crate = "parking_lot_core@0.9.12", reason = "crossterm 0.29, the terminal backend, retains parking_lot 0.12." },
  { crate = "redox_syscall@0.5.18", reason = "crossterm 0.29, the terminal backend, retains parking_lot 0.12." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/gaborbernat/secret-service-rs"]
