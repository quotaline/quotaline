[package]
name = "quotaline-status-bar"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
caseless = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quotaline-catalog = { version = "0.2.0", path = "../../catalog" }
quotaline-quota = { version = "0.2.0", path = "../quota" }
quotaline-settings = { version = "0.2.0", path = "../../settings" }
quotaline-text = { version = "0.2.0", path = "../text" }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
uniffi = { version = "0.32.2", optional = true }

[dev-dependencies]
quotaline-demo = { version = "0.2.0", path = "../../demo" }
