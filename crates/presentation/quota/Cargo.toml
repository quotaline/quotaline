[package]
name = "quotaline-quota"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
quotaline-catalog = { version = "0.2.0", path = "../../catalog" }
quotaline-text = { version = "0.2.0", path = "../text" }
uniffi = { version = "0.32.2", optional = true }
