[package]
name = "quotaline-text"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"
uniffi = { version = "0.32.2", optional = true }

[features]
test-support = []
