[package]
name = "quotaline-claude"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
memchr = "2"
path-clean = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quotaline-analytics = { version = "0.2.0", path = "../../data/analytics" }
quotaline-credentials = { version = "0.2.0", path = "../../accounts/credentials" }
quotaline-http = { version = "0.2.0", path = "../../http" }
quotaline-settings = { version = "0.2.0", path = "../../settings" }
quotaline-quota = { version = "0.2.0", path = "../../presentation/quota" }
quotaline-text = { version = "0.2.0", path = "../../presentation/text" }
url = "2.5.8"

[dev-dependencies]
futures-executor = "0.3"
quotaline-http = { version = "0.2.0", path = "../../http", features = ["test-support"] }
