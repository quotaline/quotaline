[package]
name = "quotaline-tui"
version = "0.2.0"
edition = "2024"
license = "MIT"

[features]
gnome-smoke = []

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
jiff = { version = "1", features = ["serde"] }
quotaline-analytics = { version = "0.2.0", path = "../data/analytics" }
quotaline-catalog = { version = "0.2.0", path = "../catalog" }
quotaline-demo = { version = "0.2.0", path = "../demo" }
quotaline-export = { version = "0.2.0", path = "../data/export" }
quotaline-quota = { version = "0.2.0", path = "../presentation/quota" }
quotaline-text = { version = "0.2.0", path = "../presentation/text" }
ratatui = { version = "0.30", default-features = false, features = ["termion"] }
rustix = { version = "1", features = ["event", "fs"] }
termion = "4"
textwrap = { version = "0.16", default-features = false, features = ["std", "unicode-width"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"
quotaline-history = { version = "0.2.0", path = "../data/history" }
quotaline-macos-ffi = { version = "0.2.0", path = "../../macos/adapter" }
quotaline-settings = { version = "0.2.0", path = "../settings" }
quotaline-status-bar = { version = "0.2.0", path = "../presentation/status-bar" }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
plist = "1.10"
quotaline-history = { version = "0.2.0", path = "../data/history" }
quotaline-macos-ffi = { version = "0.2.0", path = "../../macos/adapter" }
quotaline-settings = { version = "0.2.0", path = "../settings" }
quotaline-status-bar = { version = "0.2.0", path = "../presentation/status-bar" }

[dev-dependencies]
vt100 = "0.18"
tempfile = "3"
rustix = { version = "1", features = ["process", "pty", "termios"] }
