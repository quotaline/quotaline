[package]
name = "quotaline-tui"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
futures-util = "0.3"
jiff = { version = "1", features = ["serde"] }
quotaline-analytics = { version = "0.2.0", path = "../data/analytics" }
quotaline-catalog = { version = "0.2.0", path = "../catalog" }
quotaline-demo = { version = "0.2.0", path = "../demo" }
quotaline-engine = { version = "0.2.0", path = "../engine" }
quotaline-export = { version = "0.2.0", path = "../data/export" }
quotaline-quota = { version = "0.2.0", path = "../presentation/quota" }
quotaline-text = { version = "0.2.0", path = "../presentation/text" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
textwrap = { version = "0.16", default-features = false, features = ["std", "unicode-width"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
signal-hook = "0.3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["event", "fs", "process", "pty", "termios"] }

[dev-dependencies]
tempfile = "3"
vt100 = "0.18"
