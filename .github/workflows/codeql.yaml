name: 🛡️ CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions","rust","javascript-typescript"]'
      paths-ignore: '["crates/*/tests","crates/demo","gnome/tests","gnome/extension/tests","website/tests"]'
  analyze-swift:
    name: 🛡️ Analyze swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.24
          working_directory: macos
          install_args: --locked just rust swift
      - name: 🍎 Select Xcode
        id: xcode
        working-directory: macos
        run: |
          Scripts/select-xcode.sh
          echo "cache=$(xcodebuild -version | shasum -a 256 | cut -c 1-12)" >> "$GITHUB_OUTPUT"
      - name: 💾 Restore verified Rust bindings
        id: bindings
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            macos/Generated/QuotalineRustFFI.xcframework
            macos/src/QuotalineRust
          key: macos-bindings-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache }}-${{ hashFiles('crates/**', 'macos/adapter/**', 'macos/platform/**', 'macos/uniffi.toml', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'mise.toml', 'mise.lock', 'justfile') }}
      - name: 🦀 Install macOS Rust toolchain
        working-directory: macos
        run: just macos-toolchain
      - name: 🏗️ Build Rust bindings
        if: steps.bindings.outputs.cache-hit != 'true'
        working-directory: macos
        run: just macos-bindings
      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
          config: |
            paths-ignore:
              - crates/*/tests
              - crates/demo
              - gnome/tests
              - gnome/extension/tests
              - website/tests
      - name: 🏗️ Build macOS app
        working-directory: macos
        run: swift build --jobs 2
      - name: 🛡️ Analyze
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:swift"
