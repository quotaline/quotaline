name: 🏷️ Prepare Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  assemble:
    name: 🏷️ Assemble release
    if: github.repository == 'quotaline/quotaline'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.existing.outputs.version || steps.prepare.outputs.version }}
      artifact-id: ${{ steps.existing.outputs.artifact-id || steps.patch.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 📩 Reuse this run's release patch
        id: existing
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "release-patch" and .expired == false) | .id] | first // empty')
          if [[ -n "$artifact_id" ]]; then
            version=$(python3 -c 'import tomllib; from pathlib import Path; print("v" + tomllib.loads(Path("gnome/Cargo.toml").read_text())["package"]["version"])')
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
          fi
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.existing.outputs.artifact-id == ''
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.existing.outputs.artifact-id == ''
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        if: steps.existing.outputs.artifact-id == ''
        with:
          version: 2026.10.24
          install_args: --locked
          cache: false
      - name: 📦 Install locked release tools
        if: steps.existing.outputs.artifact-id == ''
        uses: tox-dev/github-workflows/install-locked-tools@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
        with:
          groups: release-prepare
          venv: ${{ runner.temp }}/release-tools
      - name: 🏷️ Select version from fragments
        id: version
        if: steps.existing.outputs.artifact-id == ''
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ -n $(git tag --list 'v*') ]]; then
            version=$(git tag --list | release-creator tags --next "$BUMP" --prefix v)
          else
            previous=$(awk '$1 == "##" { print "v" $2; exit }' website/content/changelog/_index.md)
            version=$(printf '%s\n' "$previous" | release-creator tags --next "$BUMP" --prefix v)
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: 📝 Render changelog
        id: prepare
        if: steps.existing.outputs.artifact-id == ''
        uses: tox-dev/github-workflows/prepare-towncrier@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
        env:
          SKIP: swift-format,swiftlint
        with:
          version: ${{ steps.version.outputs.version }}
      - name: 📤 Upload release patch
        id: patch
        if: steps.existing.outputs.artifact-id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  push:
    name: ⬆️ Push release commit and tag
    needs: assemble
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: release-auth
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 📩 Download release patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-patch
      - name: 🔍 Inspect remote release commit
        id: remote
        run: |
          git fetch origin main
          remote=$(git rev-parse origin/main)
          if [[ "$remote" != "$GITHUB_SHA" ]]; then
            echo "published-commit=$remote" >> "$GITHUB_OUTPUT"
          fi
      - name: 🔍 Validate release patch
        uses: tox-dev/github-workflows/validate-release-patch@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
        if: steps.remote.outputs.published-commit == ''
      - name: 🔍 Reuse prepared release commit
        if: steps.remote.outputs.published-commit != ''
        env:
          PUBLISHED_COMMIT: ${{ steps.remote.outputs.published-commit }}
        run: |
          git reset --hard "$GITHUB_SHA"
          git switch --detach "$PUBLISHED_COMMIT"
      - name: 🔑 Create release App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: ⚙️ Set App commit identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: 🔑 Configure App git credentials
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh auth setup-git --hostname github.com --force
      - name: 🏷️ Commit release changelog
        if: steps.remote.outputs.published-commit == ''
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: git commit -m "Prepare $VERSION"
      - name: ⬆️ Push release commit
        if: steps.remote.outputs.published-commit == ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: git push origin HEAD:refs/heads/main
      - name: 🏷️ Inspect remote release tag
        id: remote-tag
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          remote=$(git ls-remote origin "refs/tags/$VERSION")
          if [[ -n "$remote" ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: 🏷️ Create annotated tag
        if: steps.remote-tag.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: git tag -a "$VERSION" -m "Release $VERSION"
      - name: ⬆️ Push release tag
        if: steps.remote-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: git push origin "refs/tags/$VERSION"
