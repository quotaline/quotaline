name: 🚀 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (v1.2.3)
        required: true
      app_store_reconciled:
        description: App Store Connect checked for this version; permit another upload
        required: false
        type: boolean
        default: false
      app_store_only:
        description: Retry only the App Store upload, leaving the published GitHub Release as it is
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
  queue: max
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  previous-tag:
    name: 🏷️ Select previous tag
    if: github.repository == 'quotaline/quotaline' && !inputs.app_store_only
    needs: verify-source
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.previous }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@6.8.5
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: 🏷️ Select previous tag
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@6.8.5
        with:
          tag: ${{ env.TAG }}
  notes:
    name: 📝 Render GitHub Release notes
    needs: [previous-tag, verify-source]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@6.8.5
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: 📝 Render release notes
        uses: tox-dev/github-workflows/render-release-notes@6.8.5
        with:
          tag: ${{ env.TAG }}
          previous: ${{ needs.previous-tag.outputs.tag }}
          changelog: website/content/changelog/_index.md
          artifact-url: https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}
          artifact-label: Downloads
      - name: 📤 Upload release notes
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  verify-source:
    name: ⚙️ Resolve tagged source
    if: github.repository == 'quotaline/quotaline'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      source-artifact-id: ${{ steps.source.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: ⚙️ Record the tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Builds that need no secrets compile this snapshot rather than checking out the requested ref themselves.
      - name: 📦 Archive the tagged source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - name: 📤 Upload the tagged source
        id: source
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source.tar.gz
          if-no-files-found: error
  gnome:
    name: 🏗️ Build GNOME download
    needs: verify-source
    if: ${{ !inputs.app_store_only }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.10.24
          install_args: --locked
          cache: false
      - name: 🏗️ Build release package
        run: mise exec -- just release-package
      - name: 📤 Upload GNOME release package
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gnome-download
          path: |
            target/quotaline-gnome-linux-x86_64.tar.gz
            target/quotaline-gnome-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
  tui-linux:
    name: 🏗️ Build Linux terminal dashboard
    needs: verify-source
    if: ${{ !inputs.app_store_only }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📩 Download the tagged source
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify-source.outputs.source-artifact-id }}
          path: ${{ runner.temp }}
      - name: 📦 Unpack the tagged source
        run: tar -xzf "${{ runner.temp }}/source.tar.gz"
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.10.24
          install_args: --locked just
          cache: false
      - name: 🏗️ Build release package
        run: just tui-release-package
      - name: 📤 Upload terminal dashboard
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tui-linux
          path: |
            target/quotaline-tui-linux-x86_64.tar.gz
            target/quotaline-tui-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
  tui-macos:
    name: 🏗️ Build macOS terminal dashboard
    needs: verify-source
    if: ${{ !inputs.app_store_only }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - name: 🏗️ Build universal binary
        run: |
          cargo build --locked --release -p quotaline-tui --target aarch64-apple-darwin
          cargo build --locked --release -p quotaline-tui --target x86_64-apple-darwin
          mkdir -p target/tui-image
          lipo -create -output target/tui-image/quotaline-tui \
            target/aarch64-apple-darwin/release/quotaline-tui target/x86_64-apple-darwin/release/quotaline-tui
          cp README.md LICENSE target/tui-image/
      - name: 🔑 Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: macos/Scripts/import-certificate.sh
      - name: ✍️ Sign with the hardened runtime
        run: |
          codesign --force --options runtime --timestamp --sign "Developer ID Application" target/tui-image/quotaline-tui
          codesign --verify --strict --verbose=2 target/tui-image/quotaline-tui
      - name: 📦 Archive
        run: cd target/tui-image && zip -X -r ../quotaline-tui-macos-universal.zip .
      - name: ✍️ Notarize
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: macos/Scripts/notarize.sh target/quotaline-tui-macos-universal.zip
      - name: ⚙️ Write checksum file
        run: cd target && shasum -a 256 quotaline-tui-macos-universal.zip > quotaline-tui-macos-universal.zip.sha256
      - name: 📤 Upload terminal dashboard
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tui-macos
          path: |
            target/quotaline-tui-macos-universal.zip
            target/quotaline-tui-macos-universal.zip.sha256
          if-no-files-found: error
  tui-windows:
    name: 🏗️ Build Windows terminal dashboard
    needs: verify-source
    if: ${{ !inputs.app_store_only }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📩 Download the tagged source
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify-source.outputs.source-artifact-id }}
          path: ${{ runner.temp }}
      - name: 📦 Unpack the tagged source
        run: tar -xzf "${{ runner.temp }}/source.tar.gz"
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: 🏗️ Build release package
        shell: pwsh
        run: |
          cargo build --locked --release -p quotaline-tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory target/tui-image | Out-Null
          Copy-Item target/release/quotaline-tui.exe, README.md, LICENSE target/tui-image
          Compress-Archive -Path target/tui-image/* -DestinationPath target/quotaline-tui-windows-x86_64.zip
          $hash = (Get-FileHash -Algorithm SHA256 target/quotaline-tui-windows-x86_64.zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/target/quotaline-tui-windows-x86_64.zip.sha256", "$hash  quotaline-tui-windows-x86_64.zip`n")
      - name: 📤 Upload terminal dashboard
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tui-windows
          path: |
            target/quotaline-tui-windows-x86_64.zip
            target/quotaline-tui-windows-x86_64.zip.sha256
          if-no-files-found: error
  direct:
    name: 🏗️ Build direct and Homebrew downloads
    needs: [gnome, verify-source]
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        working-directory: macos
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.10.24
          install_args: --locked
          working_directory: macos
          cache: false
      - name: 📩 Download GNOME release package
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.gnome.outputs.artifact-id }}
          path: macos/dist/gnome
      - name: ⚙️ Use the runner temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/quotaline"
          echo "TMPDIR=$RUNNER_TEMP/quotaline" >> "$GITHUB_ENV"
      - name: 🍎 Select Xcode
        run: Scripts/select-xcode.sh
      - name: 🏗️ Build Rust bridge
        run: mise exec -- just macos-bindings
      - name: 🏷️ Stamp version
        run: just macos-stamp "${TAG#v}"
      - name: 🔑 Import Developer ID certificate
        id: identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          Scripts/import-certificate.sh
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: 🍎 Generate project
        run: cd App && xcodegen generate
      - name: 🏗️ Archive and export
        env:
          SIGNED: ${{ steps.identity.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: just macos-build-direct
      - name: 🏗️ Archive and export Homebrew
        env:
          SIGNED: ${{ steps.identity.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: just macos-build-homebrew
      - name: ✍️ Notarize and staple applications
        if: steps.identity.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          Scripts/notarize.sh "dist/direct/Quotaline.app" "dist/homebrew/Quotaline.app"
      - name: 🏗️ Package downloads
        run: |
          Scripts/package-direct.sh "${TAG#v}"
          just macos-package-homebrew "${TAG#v}"
      - name: ✍️ Notarize and staple disk images
        if: steps.identity.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          Scripts/notarize.sh dist/direct/Quotaline.dmg dist/homebrew/Quotaline-Homebrew.dmg
      - name: ⚙️ Write checksum files
        shell: bash
        run: |
          for file in dist/direct/Quotaline.zip dist/direct/Quotaline.dmg \
            dist/homebrew/Quotaline-Homebrew.zip dist/homebrew/Quotaline-Homebrew.dmg; do
            shasum -a 256 "$file" | awk '{print $1}' > "$file.sha256"
          done
      - name: 📝 Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: Scripts/appcast.sh "${TAG#v}"
      - name: 🚀 Update Homebrew cask file
        run: Scripts/update-cask.sh "${TAG#v}" dist/homebrew/Quotaline-Homebrew.dmg
      - name: 📤 Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: downloads
          path: |
            macos/dist/direct/*.zip
            macos/dist/direct/*.dmg
            macos/dist/direct/*.sha256
            macos/dist/direct/appcast.xml
            macos/dist/homebrew/*.zip
            macos/dist/homebrew/*.dmg
            macos/dist/homebrew/*.sha256
            macos/dist/gnome/*.tar.gz
            macos/dist/gnome/*.sha256
            Casks/quotaline.rb
          if-no-files-found: error
  publish:
    name: 🚀 Publish GitHub Release
    needs: [direct, notes, tui-linux, tui-macos, tui-windows, verify-source]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: 📩 Download release downloads
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.direct.outputs.artifact-id }}
          path: .
      - name: 📩 Download terminal dashboards
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: >-
            ${{ needs.tui-linux.outputs.artifact-id }},${{ needs.tui-macos.outputs.artifact-id }},${{ needs.tui-windows.outputs.artifact-id }}
          path: tui
          merge-multiple: true
      - name: 📩 Download release notes
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: ⚙️ Collect release assets
        run: |
          mkdir "$RUNNER_TEMP/release-assets"
          cp \
            macos/dist/direct/Quotaline.zip \
            macos/dist/direct/Quotaline.dmg \
            macos/dist/direct/Quotaline.zip.sha256 \
            macos/dist/direct/Quotaline.dmg.sha256 \
            macos/dist/direct/appcast.xml \
            macos/dist/homebrew/Quotaline-Homebrew.zip \
            macos/dist/homebrew/Quotaline-Homebrew.dmg \
            macos/dist/homebrew/Quotaline-Homebrew.zip.sha256 \
            macos/dist/homebrew/Quotaline-Homebrew.dmg.sha256 \
            macos/dist/gnome/quotaline-gnome-linux-x86_64.tar.gz \
            macos/dist/gnome/quotaline-gnome-linux-x86_64.tar.gz.sha256 \
            tui/quotaline-tui-linux-x86_64.tar.gz \
            tui/quotaline-tui-linux-x86_64.tar.gz.sha256 \
            tui/quotaline-tui-macos-universal.zip \
            tui/quotaline-tui-macos-universal.zip.sha256 \
            tui/quotaline-tui-windows-x86_64.zip \
            tui/quotaline-tui-windows-x86_64.zip.sha256 \
            Casks/quotaline.rb \
            "$RUNNER_TEMP/release-assets/"
      - name: 🚀 Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@6.8.5
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ env.TAG }}
          commit: ${{ needs.verify-source.outputs.commit }}
          title: ${{ env.TAG }}
          notes-file: ${{ runner.temp }}/release-notes.md
          assets-directory: ${{ runner.temp }}/release-assets
  cask:
    name: 🔀 Open the Homebrew cask update
    needs: [direct, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-auth
    permissions:
      contents: read
    steps:
      - name: 🔑 Create release App token
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes a cask branch
      - name: 📩 Download release downloads
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.direct.outputs.artifact-id }}
          path: release
      - name: 🔀 Open a cask pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          TAG: ${{ env.TAG }}
        run: |
          branch="automation/cask-${TAG#v}"
          cp release/Casks/quotaline.rb Casks/quotaline.rb
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Casks/quotaline.rb; then
            git add Casks/quotaline.rb
            git commit -m "Update Homebrew cask for ${TAG}"
            remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -n "$remote_sha" ]; then
              git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
            else
              git push origin "HEAD:refs/heads/$branch"
            fi
            owner=${GITHUB_REPOSITORY%%/*}
            gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$branch" \
              >"$RUNNER_TEMP/cask-pulls.json"
            existing_pr=$(jq -r --arg repository "$GITHUB_REPOSITORY" --arg branch "$branch" '
              [.[] | select(.head.repo.full_name == $repository and .head.ref == $branch and .base.ref == "main")] |
              .[0].number // empty
            ' "$RUNNER_TEMP/cask-pulls.json")
            if [[ -z "$existing_pr" ]]; then
              gh pr create --base main --head "$branch" --title "Update Homebrew cask for ${TAG}" \
                --body "Publish the ${TAG} Homebrew package checksum." --label "skip news"
            else
              gh pr edit "$existing_pr" --add-label "skip news"
            fi
          fi
  app-store:
    name: 🚀 Mac App Store upload (${{ inputs.tag || github.ref_name }})
    needs: verify-source
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        working-directory: macos
    permissions:
      actions: read
      contents: read
    steps:
      - name: 🔍 Require App Store reconciliation before retry
        if: github.run_attempt > 1 || (github.event_name == 'workflow_dispatch' && !inputs.app_store_reconciled)
        working-directory: .
        run: |
          echo '::error::Check App Store Connect for this version, then dispatch Release with app_store_reconciled enabled'
          exit 1
      - name: 🔍 Reject previous App Store upload attempt
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?per_page=100" \
            > "$RUNNER_TEMP/release-runs.json"
          jq -s -r --arg tag "$TAG" --argjson current "$GITHUB_RUN_ID" '
            .[].workflow_runs[] |
            select(.id != $current and (.head_branch == $tag or .head_branch == null or .event == "workflow_dispatch")) |
            [.id, (.head_branch == $tag), (.event == "workflow_dispatch")] | @tsv
          ' "$RUNNER_TEMP/release-runs.json" > "$RUNNER_TEMP/prior-release-runs"
          while IFS=$'\t' read -r run_id tag_branch dispatched; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
              > "$RUNNER_TEMP/prior-release-jobs.json"
            attempts=$(jq -r --arg tag "$TAG" --argjson tag_branch "$tag_branch" --argjson dispatched "$dispatched" '
              .jobs[] |
              select(.name == "🚀 Mac App Store upload (\($tag))" or
                (($tag_branch or $dispatched) and .name == "Mac App Store upload")) |
              .steps[]? | select(.name == "🚀 Archive, export and upload" and .started_at != null) | .started_at
            ' "$RUNNER_TEMP/prior-release-jobs.json")
            if [[ -n "$attempts" ]]; then
              echo "::error::App Store upload for $TAG was attempted in run $run_id; reconcile in App Store Connect first" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/prior-release-runs"
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.10.24
          install_args: --locked
          working_directory: macos
          cache: false
      - name: ⚙️ Use the runner temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/quotaline"
          echo "TMPDIR=$RUNNER_TEMP/quotaline" >> "$GITHUB_ENV"
      - name: 🍎 Select Xcode
        run: Scripts/select-xcode.sh
      - name: 🏗️ Build Rust bridge
        run: mise exec -- just macos-bindings
      - name: 🏷️ Stamp version
        run: just macos-stamp "${TAG#v}"
      - name: 🔑 Import App Store certificates
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: Scripts/import-certificate.sh
      - name: 🔑 Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          profiles=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profiles/quotaline.provisionprofile"
          echo "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$profiles/quotaline-widget.provisionprofile"
      - name: 🍎 Generate project
        run: cd App && xcodegen generate
      - name: 🔍 Verify tag before App Store upload
        env:
          SOURCE_COMMIT: ${{ needs.verify-source.outputs.commit }}
        run: |
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          resolved=$(awk -v name="refs/tags/$TAG^{}" '$2 == name { print $1 }' <<< "$refs")
          if [[ -z "$resolved" ]]; then
            resolved=$(awk -v name="refs/tags/$TAG" '$2 == name { print $1 }' <<< "$refs")
          fi
          if [[ "$resolved" != "$SOURCE_COMMIT" ]]; then
            echo "::error::$TAG moved after source verification" >&2
            exit 1
          fi
      - name: 🚀 Archive, export and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: just macos-build-app-store
