name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (v1.2.3)
        required: true
      app_store_reconciled:
        description: App Store Connect checked for this version; permit another upload
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
  queue: max
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  previous-tag:
    name: Find preceding tag
    if: github.repository == 'quotaline/quotaline'
    needs: verify-source
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Find preceding tag
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          tag: ${{ env.TAG }}
  contributor-metadata:
    name: Generate contributor metadata
    needs: [previous-tag, verify-source]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Read GitHub contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.previous-tag.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify-source.outputs.commit }}
        run: |
          verify_tag() {
            refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
            resolved=$(awk -v name="refs/tags/$TAG^{}" '$2 == name { print $1 }' <<< "$refs")
            if [[ -z "$resolved" ]]; then
              resolved=$(awk -v name="refs/tags/$TAG" '$2 == name { print $1 }' <<< "$refs")
            fi
            if [[ "$resolved" != "$SOURCE_COMMIT" ]]; then
              echo "::error::$TAG moved after source verification" >&2
              exit 1
            fi
          }
          verify_tag
          args=(-f "tag_name=$TAG")
          if [[ -n "$PREVIOUS" ]]; then
            args+=(-f "previous_tag_name=$PREVIOUS")
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body \
            > "$RUNNER_TEMP/generated-notes.md"
          verify_tag
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  notes:
    name: Render GitHub Release notes
    needs: [contributor-metadata, previous-tag, verify-source]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-notes
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/render-release-notes@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          tag: ${{ env.TAG }}
          previous: ${{ needs.previous-tag.outputs.tag }}
          changelog: website/content/changelog/_index.md
          artifact-url: https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}
          artifact-label: Downloads
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  verify-source:
    name: Verify tagged source
    if: github.repository == 'quotaline/quotaline'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Verify and record the tagged commit
        id: commit
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
          commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::$TAG does not point to the checked-out commit"
            exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
      - name: Match the release tag to the package version
        run: |
          version=$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("gnome/Cargo.toml").read_text())["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match GNOME package version $version"
            exit 1
          fi
          if ! grep -Fq "MARKETING_VERSION: \"$version\"" macos/App/project.yml ||
            ! grep -Fq "SOURCE_VERSION: \"$version\"" macos/App/project.yml; then
            echo "::error::Xcode source version does not match $TAG"
            exit 1
          fi
          if ! grep -Fq "## ${TAG#v} (" website/content/changelog/_index.md; then
            echo "::error::Tag $TAG has no changelog entry"
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          cache: false
      - name: Install locked source-check tools
        uses: tox-dev/github-workflows/install-locked-tools@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          groups: release-check
          venv: ${{ runner.temp }}/release-tools
      - uses: tox-dev/github-workflows/verify-frozen-hooks@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
      - name: Run cooled source hooks
        env:
          SKIP: swift-format,swiftlint
          UV_EXCLUDE_NEWER: 7 days
          UV_NO_CONFIG: "1"
          UV_NO_SOURCES: "1"
        run: |
          unset UV_CONFIG_FILE UV_INDEX UV_INDEX_URL UV_DEFAULT_INDEX UV_EXTRA_INDEX_URL
          unset UV_FIND_LINKS UV_EXCLUDE_NEWER_PACKAGE
          unset UV_INSECURE_HOST UV_SYSTEM_CERTS SSL_CERT_FILE SSL_CERT_DIR
          prek run --all-files
      - name: Require a green commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: macos/Scripts/check-commit-verdict.sh "$TAG"
  preflight:
    name: Require App Store credentials
    needs: verify-source
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    outputs:
      app_store: ${{ steps.check.outputs.app_store }}
    steps:
      # A job cannot read secrets in its own `if`. Check App Store credentials before its upload starts.
      - name: Require the App Store credentials
        id: check
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          for name in APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APP_STORE_PROVISIONING_PROFILE_BASE64 APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cannot upload to the App Store without:$missing"
            exit 1
          fi
          echo "app_store=true" >> "$GITHUB_OUTPUT"
  gnome:
    name: GNOME download
    needs: verify-source
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          persist-credentials: false
      - name: Install extension packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell unzip
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          cache: false
      - run: mise exec -- just release-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-download
          path: |
            target/quotaline-gnome-linux-x86_64.tar.gz
            target/quotaline-gnome-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
  direct:
    name: Direct and Homebrew downloads
    needs: [gnome, verify-source]
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        working-directory: macos
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          working_directory: macos
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gnome-download
          path: macos/dist/gnome
      - name: Use the runner temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/quotaline"
          echo "TMPDIR=$RUNNER_TEMP/quotaline" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: Scripts/select-xcode.sh
      - name: Build Rust bridge
        run: mise exec -- just macos-bindings
      - name: Stamp version
        run: just macos-stamp "${TAG#v}"
      - name: Verify the release build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(just macos-version --build)"
          published_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -n "$published_tag" ]; then
            appcast="$RUNNER_TEMP/published-appcast.xml"
            gh release download "$published_tag" --pattern appcast.xml --output "$appcast"
            # The element name carries a colon, so the substitution needs a delimiter the markup cannot contain.
            published="$(sed -n 's|.*<sparkle:version>\([0-9][0-9]*\)</sparkle:version>.*|\1|p' "$appcast" | head -1)"
            [[ "$current" =~ ^[0-9]+$ && "$published" =~ ^[0-9]+$ ]] || {
              echo "::error::Could not read numeric build numbers from git and $published_tag"
              exit 1
            }
            if [ "$published_tag" = "$TAG" ]; then
              ((current == published)) || {
                echo "::error::$TAG was published with build $published, but this checkout produces $current"
                exit 1
              }
            elif ((current <= published)); then
              echo "::error::Build $current must be greater than $published from $published_tag"
              exit 1
            fi
          fi
      - name: Require release credentials
        # A tag must never publish an app Gatekeeper rejects or a feed Sparkle cannot verify, so the job stops here
        # rather than falling back to an ad-hoc build. Use the ad-hoc workflow_dispatch build for unsigned testing.
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          missing=""
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD TEAM_ID APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64 SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cannot publish a release without:$missing"
            exit 1
          fi
      - name: Import Developer ID certificate
        id: identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          Scripts/import-certificate.sh
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Archive and export
        env:
          SIGNED: ${{ steps.identity.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: just macos-build-direct
      - name: Archive and export Homebrew
        env:
          SIGNED: ${{ steps.identity.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: just macos-build-homebrew
      - name: Notarize and staple applications
        if: steps.identity.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          Scripts/notarize.sh "dist/direct/Quotaline.app" "dist/homebrew/Quotaline.app"
      - name: Package downloads
        run: |
          Scripts/package-direct.sh "${TAG#v}"
          just macos-package-homebrew "${TAG#v}"
      - name: Notarize and staple disk images
        if: steps.identity.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          Scripts/notarize.sh dist/direct/Quotaline.dmg dist/homebrew/Quotaline-Homebrew.dmg
      - name: Refresh checksums
        shell: bash
        run: |
          for file in dist/direct/Quotaline.zip dist/direct/Quotaline.dmg \
            dist/homebrew/Quotaline-Homebrew.zip dist/homebrew/Quotaline-Homebrew.dmg; do
            shasum -a 256 "$file" | awk '{print $1}' > "$file.sha256"
          done
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: Scripts/appcast.sh "${TAG#v}"
      - name: Update Homebrew cask file
        run: Scripts/update-cask.sh "${TAG#v}" dist/homebrew/Quotaline-Homebrew.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads
          path: |
            macos/dist/direct/*.zip
            macos/dist/direct/*.dmg
            macos/dist/direct/*.sha256
            macos/dist/direct/appcast.xml
            macos/dist/homebrew/*.zip
            macos/dist/homebrew/*.dmg
            macos/dist/homebrew/*.sha256
            macos/dist/gnome/*.tar.gz
            macos/dist/gnome/*.sha256
            Casks/quotaline.rb
          if-no-files-found: error
  publish:
    name: Publish GitHub release
    needs: [direct, notes, verify-source]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}
      - name: Collect release assets
        run: |
          mkdir "$RUNNER_TEMP/release-assets"
          cp \
            macos/dist/direct/Quotaline.zip \
            macos/dist/direct/Quotaline.dmg \
            macos/dist/direct/Quotaline.zip.sha256 \
            macos/dist/direct/Quotaline.dmg.sha256 \
            macos/dist/direct/appcast.xml \
            macos/dist/homebrew/Quotaline-Homebrew.zip \
            macos/dist/homebrew/Quotaline-Homebrew.dmg \
            macos/dist/homebrew/Quotaline-Homebrew.zip.sha256 \
            macos/dist/homebrew/Quotaline-Homebrew.dmg.sha256 \
            macos/dist/gnome/quotaline-gnome-linux-x86_64.tar.gz \
            macos/dist/gnome/quotaline-gnome-linux-x86_64.tar.gz.sha256 \
            Casks/quotaline.rb \
            "$RUNNER_TEMP/release-assets/"
      - name: Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ env.TAG }}
          commit: ${{ needs.verify-source.outputs.commit }}
          title: ${{ env.TAG }}
          notes-file: ${{ runner.temp }}/release-notes.md
          assets-directory: ${{ runner.temp }}/release-assets
  cask:
    name: Open the Homebrew cask update
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-auth
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes a cask branch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads
          path: release
      - name: Open a cask pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          TAG: ${{ env.TAG }}
        run: |
          branch="automation/cask-${TAG#v}"
          cp release/Casks/quotaline.rb Casks/quotaline.rb
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Casks/quotaline.rb; then
            git add Casks/quotaline.rb
            git commit -m "Update Homebrew cask for ${TAG}"
            remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -n "$remote_sha" ]; then
              git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
            else
              git push origin "HEAD:refs/heads/$branch"
            fi
            owner=${GITHUB_REPOSITORY%%/*}
            gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$branch" \
              >"$RUNNER_TEMP/cask-pulls.json"
            existing_pr=$(jq -er --arg repository "$GITHUB_REPOSITORY" --arg branch "$branch" '
              [.[] | select(.head.repo.full_name == $repository and .head.ref == $branch and .base.ref == "main")] |
              if length == 0 then "" elif length == 1 then (.[0].number | tostring) else error("multiple cask PRs") end
            ' "$RUNNER_TEMP/cask-pulls.json")
            if [[ -z "$existing_pr" ]]; then
              gh pr create --base main --head "$branch" --title "Update Homebrew cask for ${TAG}" \
                --body "Publish the ${TAG} Homebrew package checksum." --label "skip news"
            else
              gh pr edit "$existing_pr" --add-label "skip news"
            fi
          fi
  app-store:
    name: Mac App Store upload (${{ inputs.tag || github.ref_name }})
    needs: [preflight, verify-source]
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        working-directory: macos
    permissions:
      actions: read
      contents: read
    if: needs.preflight.outputs.app_store == 'true'
    steps:
      - name: Require App Store reconciliation before retry
        if: github.run_attempt > 1 || (github.event_name == 'workflow_dispatch' && !inputs.app_store_reconciled)
        working-directory: .
        run: |
          echo '::error::Check App Store Connect for this version, then dispatch Release with app_store_reconciled enabled'
          exit 1
      - name: Reject previous App Store upload attempt
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?per_page=100" \
            > "$RUNNER_TEMP/release-runs.json"
          jq -s -r --arg tag "$TAG" --argjson current "$GITHUB_RUN_ID" '
            .[].workflow_runs[] |
            select(.id != $current and (.head_branch == $tag or .head_branch == null or .event == "workflow_dispatch")) |
            [.id, (.head_branch == $tag), (.event == "workflow_dispatch")] | @tsv
          ' "$RUNNER_TEMP/release-runs.json" > "$RUNNER_TEMP/prior-release-runs"
          while IFS=$'\t' read -r run_id tag_branch dispatched; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
              > "$RUNNER_TEMP/prior-release-jobs.json"
            attempts=$(jq -r --arg tag "$TAG" --argjson tag_branch "$tag_branch" --argjson dispatched "$dispatched" '
              .jobs[] |
              select(.name == "Mac App Store upload (\($tag))" or
                (($tag_branch or $dispatched) and .name == "Mac App Store upload")) |
              .steps[]? | select(.name == "Archive, export and upload" and .started_at != null) | .started_at
            ' "$RUNNER_TEMP/prior-release-jobs.json")
            if [[ -n "$attempts" ]]; then
              echo "::error::App Store upload for $TAG was attempted in run $run_id; reconcile in App Store Connect first" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/prior-release-runs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          working_directory: macos
          cache: false
      - name: Use the runner temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/quotaline"
          echo "TMPDIR=$RUNNER_TEMP/quotaline" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: Scripts/select-xcode.sh
      - name: Build Rust bridge
        run: mise exec -- just macos-bindings
      - name: Stamp version
        run: just macos-stamp "${TAG#v}"
      - name: Import App Store certificates
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: Scripts/import-certificate.sh
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          profiles=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profiles/quotaline.provisionprofile"
          echo "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$profiles/quotaline-widget.provisionprofile"
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Verify tag before App Store upload
        env:
          SOURCE_COMMIT: ${{ needs.verify-source.outputs.commit }}
        run: |
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          resolved=$(awk -v name="refs/tags/$TAG^{}" '$2 == name { print $1 }' <<< "$refs")
          if [[ -z "$resolved" ]]; then
            resolved=$(awk -v name="refs/tags/$TAG" '$2 == name { print $1 }' <<< "$refs")
          fi
          if [[ "$resolved" != "$SOURCE_COMMIT" ]]; then
            echo "::error::$TAG moved after source verification" >&2
            exit 1
          fi
      - name: Archive, export and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: just macos-build-app-store
