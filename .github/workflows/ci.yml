name: 🧪 CI
run-name: ${{ github.event_name == 'pull_request' && format('CI / PR {0} / base {1}', github.event.pull_request.number, github.event.pull_request.base.sha) || format('CI / {0}', github.ref_name) }}
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # Pull requests and main run macOS 26 only, to fit the organization's five macOS runners; every runtime, package
  # mode and distribution runs nightly.
  schedule:
    - cron: "23 2 * * *"
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      crates: ${{ steps.paths.outputs.crates }}
      gnome: ${{ steps.paths.outputs.gnome }}
      macos: ${{ steps.paths.outputs.macos }}
      macos_rust: ${{ steps.paths.outputs.macos_rust }}
      shared: ${{ steps.paths.outputs.shared }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: 🧪 Test incremental change detection
        run: |
          mkdir -p target/tmp
          TMPDIR="$PWD/target/tmp" bash macos/Scripts/test-ci-change-base.sh
      - name: 🧭 Find the last successful ancestor on this PR base
        if: github.event_name == 'pull_request'
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f status=success -f branch="$HEAD_REF" -f per_page=100 |
            bash macos/Scripts/ci-change-base.sh
      - name: 🧭 Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: paths
        with:
          token: ''
          base: ${{ steps.baseline.outputs.base || github.event.before || github.sha }}
          filters: |
            crates:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            gnome:
              - 'gnome/**'
            macos_rust:
              - 'macos/adapter/**'
              - 'macos/platform/**'
              - 'macos/uniffi.toml'
            macos:
              - 'macos/**'
            shared:
              - 'macos/Scripts/*ci-*'
              - 'Casks/**'
              - '.config/**'
              - '.github/workflows/**'
              - '.gitignore'
              - 'rust-toolchain.toml'
              - '.rustfmt.toml'
              - 'justfile'
              - 'mise.toml'
              - 'mise.lock'
              - 'deny.toml'
              - 'biome.json'
              - '_typos.toml'
              - '.pre-commit-config.yaml'
            docs:
              - 'README.md'
              - 'website/**'
              - '.readthedocs.yaml'
  macos-runtimes:
    name: ⚙️ Select macOS runtimes
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.matrix.outputs.ui }}
      application: ${{ steps.matrix.outputs.application }}
      package: ${{ steps.matrix.outputs.package }}
      full: ${{ steps.matrix.outputs.full }}
      ui-shards: ${{ steps.matrix.outputs.ui-shards }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Create temp directory
        run: mkdir -p target/tmp
      - name: 🧪 Test runtime matrix selection
        run: TMPDIR="$PWD/target/tmp" bash macos/Scripts/test-ci-runtime-matrix.sh
      - name: ⚙️ Select deployed runtimes
        id: matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_MATRIX: ${{ contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && '1' || '0' }}
        run: gh api repos/actions/runner-images/releases/tags/xcode-27-arm64%2F20260907.0173 | macos/Scripts/ci-runtime-matrix.sh
  crates-coverage:
    name: 📊 Crates coverage
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 💾 Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: crates-coverage
          workspaces: . -> target/llvm-cov-target
      - name: 📊 Measure crate coverage
        run: mise exec -- just coverage-crates
        env:
          TMB_TMPDIR: ${{ runner.temp }}/tmb
          TMB_NEXTEST_PROFILE: ci-hosted
  lint:
    name: 🧹 Lint
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.gnome == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TMB_RUST_SCOPE: ${{ (needs.changes.outputs.crates == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name)) && 'workspace' || 'gnome' }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 💾 Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: 💾 Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('gnome/package-lock.json') }}
      - name: 🧹 Check formatting
        run: mise exec -- just format-check
      - name: 🔎 Check crates compile
        run: mise exec -- just check
      - name: 🧹 Run clippy
        run: mise exec -- just clippy
      - name: 🧹 Lint GNOME extension
        run: mise exec -- just lint-extension
  validate:
    name: 🧹 Validate workflows, docs and site
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 🧹 Lint workflows
        run: mise exec -- just lint-workflow
      - name: 🧹 Lint docs
        run: mise exec -- just lint-docs
      - name: 📖 Build website
        run: mise exec -- just site
      - name: 🔍 Check website
        run: mise exec -- just site-check
      - name: 🔍 Verify website output files
        run: |
          test -s website/public/index.html
          test -s website/public/llms.txt
          test -s website/public/sitemap.xml
          test -s website/public/robots.txt
          test -s website/public/start/index.md
          test -s website/public/reference/providers/index.md
  dependencies:
    name: 🧹 Lint dependencies
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.gnome == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 🧹 Lint dependencies
        run: mise exec -- just lint-deps
  build:
    name: 🏗️ Build
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.gnome == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Install extension packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell unzip
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 💾 Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: 💾 Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('gnome/package-lock.json') }}
      - name: 🏗️ Build release package
        run: mise exec -- just release-package
      - name: 📤 Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            target/quotaline-gnome-linux-x86_64.tar.gz
            target/quotaline-gnome-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
  rust-tests:
    name: 🧪 Rust tests
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.gnome == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TMB_RUST_SCOPE: ${{ (needs.changes.outputs.crates == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name)) && 'workspace' || 'gnome' }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 💾 Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: llvm-cov
          workspaces: . -> target/llvm-cov-target
      - name: 📊 Measure Rust coverage
        run: mise exec -- just coverage-rust
        env:
          TMB_TMPDIR: ${{ runner.temp }}/tmb
          TMB_NEXTEST_PROFILE: ci-hosted
      - name: 📤 Upload Rust coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-report
          path: target/rust-coverage-report.json
          if-no-files-found: error
          retention-days: 7
  gnome-coverage:
    name: 📊 GNOME coverage
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.gnome == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TMB_RUST_SCOPE: ${{ (needs.changes.outputs.crates == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name)) && 'workspace' || 'gnome' }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Install GNOME Shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell gnome-keyring libsecret-tools dbus-bin dbus-daemon
      - name: 🔍 Verify GNOME Shell version
        run: gnome-shell --version | grep '^GNOME Shell 50[.]'
        shell: bash
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 💾 Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: llvm-cov
          workspaces: . -> target/llvm-cov-target
      - name: 💾 Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('gnome/package-lock.json') }}
      - name: 📊 Measure GNOME coverage
        run: mise exec -- just coverage-gnome
        env:
          TMB_TMPDIR: ${{ runner.temp }}/tmb
          TMB_NEXTEST_PROFILE: ci-hosted
      - name: 📤 Upload GNOME Rust coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-rust-report
          path: target/rust-coverage-report.json
          if-no-files-found: error
          retention-days: 7
      - name: 📤 Retain Shell renders and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-evidence
          path: |
            target/shell-screenshots/
            target/js-coverage/report.json
          if-no-files-found: warn
          retention-days: 7
  rust-coverage:
    name: 📊 Rust coverage
    needs: [rust-tests, gnome-coverage]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 📩 Download Rust coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-report
          path: target/coverage-rust
      - name: 📩 Download GNOME Rust coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gnome-rust-report
          path: target/coverage-gnome
      - name: 📊 Merge Rust coverage
        run: mise exec -- just coverage-merge
      - name: 📤 Upload merged Rust coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: target/rust-coverage-report.json
          if-no-files-found: error
          retention-days: 7
  release:
    name: 🔍 Verify release package
    needs: [build, lint, validate, dependencies, crates-coverage, rust-coverage]
    if: ${{ always() && needs.build.result == 'success' && needs.lint.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && needs.dependencies.result == 'success' && (needs.crates-coverage.result == 'success' || needs.crates-coverage.result == 'skipped') && needs.rust-coverage.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 📩 Download release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: target
      - name: 🔍 Verify release package
        run: mise exec -- just verify-release-package
      - name: 📤 Upload GNOME release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quotaline-gnome-linux-x86_64
          path: |
            target/quotaline-gnome-linux-x86_64.tar.gz
            target/quotaline-gnome-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
  macos-ffi-coverage:
    name: 📊 macOS FFI coverage
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos_rust == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
      - name: 💾 Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-ffi-coverage
          workspaces: . -> target/llvm-cov-target
      - name: 🧹 Check macOS FFI formatting
        run: mise exec -- cargo fmt -p quotaline-macos-ffi --check
      - name: 🏗️ Check macOS FFI compiles
        run: mise exec -- cargo check --locked -p quotaline-macos-ffi --all-targets
      - name: 🧹 Run clippy on macOS FFI
        run: mise exec -- cargo clippy --locked -p quotaline-macos-ffi --all-targets -- -D warnings
      - name: 📊 Measure macOS FFI coverage
        run: mise exec -- just coverage-macos-ffi
        env:
          TMB_TMPDIR: ${{ runner.temp }}/tmb
          TMB_NEXTEST_PROFILE: ci-hosted
  macos-build:
    name: 🏗️ Build macOS
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: macos
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          working_directory: macos
          install_args: --locked just
      - name: 🍎 Select Xcode
        id: xcode
        run: |
          Scripts/select-xcode.sh
          echo "cache=$(xcodebuild -version | shasum -a 256 | cut -c 1-12)" >> "$GITHUB_OUTPUT"
      - name: 💾 Restore verified Rust bindings
        id: bindings
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/Generated/QuotalineRustFFI.xcframework
            macos/src/QuotalineRust
          key: macos-bindings-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache }}-${{ hashFiles('crates/**', 'macos/adapter/**', 'macos/platform/**', 'macos/uniffi.toml', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'mise.toml', 'mise.lock', 'justfile') }}
      - name: 🧰 Install mise tools
        if: steps.bindings.outputs.cache-hit != 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          working_directory: macos
          install_args: --locked just rust swift
      - name: 🦀 Install macOS Rust toolchain
        run: just macos-toolchain
      - name: 💾 Restore Rust build cache
        if: steps.bindings.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-rust
          workspaces: . -> target/macos-rust
      - name: 💾 Restore UniFFI tools cache
        if: steps.bindings.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/uniffi-tools
          key: uniffi-0.32.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: 🏗️ Build Rust bindings
        if: steps.bindings.outputs.cache-hit != 'true'
        run: just macos-bindings
      - name: 🔍 Verify Rust bridge
        if: steps.bindings.outputs.cache-hit != 'true'
        run: just macos-bridge-verify
      - name: 📤 Upload Rust bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-rust-bindings
          path: |
            macos/Generated/QuotalineRustFFI.xcframework
            macos/src/QuotalineRust
          if-no-files-found: error
          retention-days: 1
  macos-lint:
    name: 🧹 macOS lint
    needs: changes
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: macos
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          working_directory: macos
          install_args: --locked just jq swift swiftlint uv xcodegen
      - name: 🍎 Select Xcode
        run: Scripts/select-xcode.sh
      - name: 🧹 Lint Swift
        run: just macos-lint-swift
      - name: 🧹 Check justfile formatting
        run: just --unstable --fmt --check --justfile ../justfile
      - name: 🧪 Test macOS scripts
        run: just macos-test-scripts
  macos-coverage:
    name: 📊 macOS coverage
    needs: [changes, macos-build]
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    env:
      QUOTALINE_RENDER_CAPTURE_ONLY: 1
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          working_directory: macos
          install_args: --locked just jq ripgrep swift uv
      - name: 📩 Download Rust bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-rust-bindings
          path: macos
      - name: 🍎 Select Xcode
        run: Scripts/select-xcode.sh
      - name: ⚙️ Identify the coverage toolchain
        id: coverage-toolchain
        shell: bash
        run: |
          {
            swift --version
            xcodebuild -version
            xcrun --show-sdk-version
            sw_vers
            pwd
          } > "$RUNNER_TEMP/coverage-toolchain"
          echo "fingerprint=$(shasum -a 256 "$RUNNER_TEMP/coverage-toolchain" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: 💾 Restore matching coverage products
        id: coverage-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build/coverage
          key: macos-native-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-toolchain.outputs.fingerprint }}-${{ hashFiles('macos/Package.swift', 'macos/src/**', 'macos/tests/**', 'macos/Generated/**', 'macos/Scripts/**', 'macos/mise.*', 'mise.*', 'justfile', '.github/workflows/ci.yml') }}
      - name: 🧪 Run all tests with fresh coverage profiles
        env:
          COVERAGE_CACHE_HIT: ${{ steps.coverage-cache.outputs.cache-hit }}
          QUOTALINE_RENDER_ARTIFACTS: ${{ runner.temp }}/settings-render
        run: |
          args=()
          if [[ "$COVERAGE_CACHE_HIT" == true ]]; then args+=(--skip-build); fi
          just macos-with-hang-samples 10 "$RUNNER_TEMP/hang" just macos-coverage-prepared .build/coverage "${args[@]}"
      - name: 📤 Upload hang samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: macos-coverage-hang
          path: ${{ runner.temp }}/hang
          if-no-files-found: ignore
          retention-days: 7
      - name: 📤 Upload rendered package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: macos-rendered-package
          path: ${{ runner.temp }}/settings-render
          if-no-files-found: warn
          retention-days: 7
      - name: 📤 Upload Swift coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: macos-swift-coverage
          path: target/macos-swift-coverage.json
          if-no-files-found: ignore
          retention-days: 7
  macos-package:
    name: 🧪 macOS package tests
    needs: [changes, macos-build, macos-runtimes]
    if: ${{ needs.macos-runtimes.outputs.full == 'true' && (needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.macos-runtimes.outputs.package) }}
    defaults:
      run:
        working-directory: macos
    env:
      QUOTALINE_RENDER_CAPTURE_ONLY: 1
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          working_directory: macos
          install_args: --locked just jq ripgrep swift uv
      - name: 📩 Download Rust bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-rust-bindings
          path: macos
      - name: 💾 Restore SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/.build/checkouts
            macos/.build/repositories
            macos/.build/artifacts
          key: macos-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/Package.swift') }}
      - name: 🍎 Verify runtime and select Xcode
        run: |
          version="$(sw_vers -productVersion)"
          [[ "${version%%.*}" == "$RUNTIME_MAJOR" ]]
          Scripts/select-xcode.sh
        env:
          RUNTIME_MAJOR: ${{ matrix.runtime-major }}
          MIN_XCODE_MAJOR: ${{ matrix.minimum-xcode }}
          EXACT_XCODE_MAJOR: ${{ matrix.minimum-xcode }}
      - name: 🧪 Test macOS package
        run: just macos-test-prepared
        if: matrix.mode == 'nonpresenting'
        env:
          QUOTALINE_RENDER_ARTIFACTS: ${{ runner.temp }}/settings-render
      - name: 🧪 Run native tests
        run: just macos-with-hang-samples 10 "$RUNNER_TEMP/hang" just macos-test-native-prepared
        if: matrix.mode == 'native'
        env:
          QUOTALINE_RENDER_ARTIFACTS: ${{ runner.temp }}/settings-render
      - name: 📤 Upload hang samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && matrix.mode == 'native' }}
        with:
          name: macos-package-hang-${{ matrix.runtime-major }}
          path: ${{ runner.temp }}/hang
          if-no-files-found: ignore
          retention-days: 7
      - name: 📤 Upload rendered package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: macos-package-${{ matrix.runtime-major }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/settings-render
          if-no-files-found: warn
          retention-days: 7
  macos-rendered:
    name: 🧪 Check rendered text
    needs: [changes, macos-coverage]
    if: ${{ !cancelled() && needs.macos-coverage.result != 'skipped' && (needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name)) }}
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: macos
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📩 Download rendered package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-rendered-package
          path: ${{ runner.temp }}/settings-render
      - name: 📦 Install OCR
        run: Scripts/install-ocr.sh
        env:
          TMPDIR: ${{ runner.temp }}
      - name: 🔍 Check rendered text
        run: |
          Scripts/check-rendered-text.sh "$RUNNER_TEMP/settings-render" 16
          image="$(find "$RUNNER_TEMP/settings-render" -name verifier-present.png -print -quit)"
          test -n "$image"
          Scripts/test-rendered-text.sh "$image"
        env:
          TMPDIR: ${{ runner.temp }}
  macos-ui:
    name: 🧪 macOS UI tests
    needs: [changes, macos-build, macos-runtimes]
    if: ${{ needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.macos-runtimes.outputs.ui) }}
    uses: ./.github/workflows/macos-ui.yml # zizmor: ignore[self-repository] ./ is the documented local reusable workflow path
    with:
      runner: ${{ matrix.runner }}
      runtime-major: ${{ matrix.runtime-major }}
      minimum-xcode: ${{ matrix.minimum-xcode }}
      shards: ${{ fromJSON(needs.macos-runtimes.outputs.ui-shards) }}
  macos-application:
    name: 🏗️ Build macOS application
    needs: [changes, macos-build, macos-runtimes]
    if: ${{ needs.macos-runtimes.outputs.full == 'true' && (needs.changes.outputs.crates == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.shared == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.macos-runtimes.outputs.application) }}
    env:
      CONFIGURATION: ${{ matrix.configuration }}
    defaults:
      run:
        working-directory: macos
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install mise tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          working_directory: macos
          install_args: --locked just jq uv xcodegen
      - name: 📩 Download Rust bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-rust-bindings
          path: macos
      - name: 💾 Restore Xcode package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build/xcode-packages
          key: macos-xcode-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/Package.swift', 'macos/App/project.yml') }}
      - name: 🍎 Verify runtime and select Xcode
        run: |
          version="$(sw_vers -productVersion)"
          [[ "${version%%.*}" == "$RUNTIME_MAJOR" ]]
          Scripts/select-xcode.sh
        env:
          RUNTIME_MAJOR: ${{ matrix.runtime-major }}
          MIN_XCODE_MAJOR: ${{ matrix.minimum-xcode }}
          EXACT_XCODE_MAJOR: ${{ matrix.minimum-xcode }}
      - name: 🍎 Generate project
        run: just macos-xcode
      - name: 🏗️ Build application
        run: >-
          xcodebuild -project App/Quotaline.xcodeproj -scheme "$SCHEME" -configuration "$CONFIGURATION" -destination 'platform=macOS' -derivedDataPath .build/app-derived -jobs 2 -clonedSourcePackagesDirPath .build/xcode-packages CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= SPARKLE_PUBLIC_ED_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= build
        env:
          SCHEME: ${{ matrix.scheme }}
      - name: 🔍 Verify build settings
        run: >-
          Scripts/verify-build-settings.sh "$TARGET" "$CONFIGURATION" "$DISTRIBUTION" "$CONDITION" "$SANDBOX" "$ENTITLEMENTS"
        env:
          TARGET: ${{ matrix.target }}
          DISTRIBUTION: ${{ matrix.distribution }}
          CONDITION: ${{ matrix.condition }}
          SANDBOX: ${{ matrix.sandbox }}
          ENTITLEMENTS: ${{ matrix.entitlements }}
      - name: 🔍 Verify deployment targets
        run: >-
          Scripts/verify-deployment-targets.sh ".build/app-derived/Build/Products/$CONFIGURATION/Quotaline.app" 15.0
      - name: 🔍 Verify app bundle
        run: >-
          just macos-verify-app-bundle ".build/app-derived/Build/Products/$CONFIGURATION/Quotaline.app" "$DISTRIBUTION" "$UPDATER"
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          UPDATER: ${{ matrix.updater }}
      - name: 🏗️ Package application
        run: >-
          ditto -c -k ".build/app-derived/Build/Products/$CONFIGURATION/Quotaline.app" ".build/quotaline-$CONFIGURATION-macos.zip"
      - name: 📤 Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.configuration }}-${{ matrix.runtime-major }}-candidate
          path: macos/.build/quotaline-${{ matrix.configuration }}-macos.zip
          if-no-files-found: error
          retention-days: 1
  required-checks:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'required-checks' || 'required-checks (non-PR)' }}
    if: ${{ always() }}
    needs:
      - changes
      - macos-runtimes
      - crates-coverage
      - lint
      - validate
      - dependencies
      - build
      - rust-tests
      - gnome-coverage
      - rust-coverage
      - release
      - macos-ffi-coverage
      - macos-build
      - macos-lint
      - macos-coverage
      - macos-package
      - macos-rendered
      - macos-ui
      - macos-application
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: 🚦 Require change detection
        env:
          JOB_RESULT: ${{ needs.changes.result }}
        run: test "$JOB_RESULT" = success
      - name: 🚦 Require change detection
        env:
          JOB_RESULT: ${{ needs.validate.result }}
        run: test "$JOB_RESULT" = success
      - name: 🚦 Require every applicable CI job
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$CI_RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$CI_RESULTS" >/dev/null
