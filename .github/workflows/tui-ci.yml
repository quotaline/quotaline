name: 🧪 TUI CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tui-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tui:
    name: 🧪 TUI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: 🧰 Install mise tools
        if: runner.os != 'Windows'
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.10.24
          install_args: --locked just jq aqua:taiki-e/cargo-llvm-cov github:nextest-rs/nextest
      - name: 💾 Restore Rust build cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: tui-coverage
          workspaces: . -> target/tui-coverage
      - name: 🧹 Check TUI formatting and lint
        run: |
          cargo fmt --check -p quotaline-tui
          cargo check --locked -p quotaline-tui --all-targets --all-features
          cargo clippy --locked -p quotaline-tui --all-targets --all-features -- -D warnings
      # The terminal tests drive a Unix pseudoterminal, so Windows runs the unit tests and coverage comes from Unix.
      - name: 🧪 Run TUI unit tests
        if: runner.os == 'Windows'
        run: cargo test --locked -p quotaline-tui
      - name: 📊 Require full TUI line and branch coverage
        if: runner.os != 'Windows'
        run: just coverage-tui
        env:
          TMB_TMPDIR: ${{ runner.temp }}/tui
          TMB_NEXTEST_PROFILE: ci-hosted
      - name: 📤 Upload TUI coverage report
        if: ${{ !cancelled() && hashFiles('target/tui-coverage.json') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tui-coverage-${{ matrix.os }}
          path: target/tui-coverage.json
          if-no-files-found: error
          retention-days: 7
