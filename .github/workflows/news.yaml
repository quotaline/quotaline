name: 📝 Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
# Label events get their own group: a label added while opening the PR must not cancel the run for opening, which would
# show as a failed check. A new push still cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  news:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@6.8.0
        with:
          groups: release-news
          venv: ${{ runner.temp }}/release-tools
      - name: 🔍 Validate news fragments
        uses: tox-dev/github-workflows/validate-news@6.8.0
