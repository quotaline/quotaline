name: 🔒 Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@2511056b16f5e4040ba3fe71b53224910267b29e # 6.2.2
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh project lock"
      pull-request-body: |-
        Relock `pylock.toml` after the seven-day cooldown.
