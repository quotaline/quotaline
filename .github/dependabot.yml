version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      cargo:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/gnome"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: swift
    directory: "/macos"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      swift:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      pre-commit:
        patterns:
          - "*"
    cooldown:
      default-days: 7
